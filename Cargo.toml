[package]
name = "nukleus"
authors = ["Skuld Norniern <skuldnorniern@gmail.com>"]
version = "0.1.0"
repository = "https://github.com/Nukleus-Language/nukleus"
description = "New AI, GUI, Cross-Platform Programming language"
edition = "2024"
license = "Apache-2.0"

[features]
default = []
jit = ["codegen/jit"]
legacy = []

[dependencies]
log = "0.4"

lexer = { path = "./nk-lexer", package = "nk-lexer" }
astgen = { path = "./nk-astgen" }
codegen = { path = "./nk-codegen", default-features = false, features = ["lamina"] }
inksac = "0.5.0"

[dev-dependencies]
divan = "0.1.0"

[lints.clippy]
unwrap_used = "deny"
cognitive_complexity = "deny"

[[bench]]
name = "lexer"
harness = false

[[bench]]
name = "astgen"
harness = false

[workspace]
members = [
	"nk-diagnostics",
	"nk-lexer",
	"nk-astgen",
	"nk-codegen",
]

[profile.release]
lto = true
