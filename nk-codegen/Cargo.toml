[package]
name = "codegen"
version = "0.1.0"
edition = "2021"

[features]
default = ["lamina"]
lamina = []
jit = ["dep:cranelift", "dep:cranelift-module", "dep:cranelift-jit", "dep:cranelift-native", "dep:cranelift-codegen"]

[dependencies]
inksac = "0.5.0"
lexer = { path = "../nk-lexer", package="nk-lexer" }
astgen = { path = "../nk-astgen" }
nk-diagnostics = { path = "../nk-diagnostics" }
cranelift = { version = "0.114.0", optional = true }
cranelift-module = { version = "0.114.0", optional = true }
cranelift-jit = { version = "0.114.0", optional = true }
cranelift-native = { version = "0.114.0", optional = true }
cranelift-codegen = { version = "0.114.0", optional = true }
lamina = "0.0.8"


[lints.clippy]
unwrap_used = "deny"
cognitive_complexity = "deny"
